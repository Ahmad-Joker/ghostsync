<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; img-src 'self' data:"
    />
    <link rel="icon" href="data:," />
    <title>FieldLedger</title>
  </head>
  <body>
    <div id="app">
      <header class="gs-header fl-header">
        <div class="gs-brand">
          <span class="gs-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M10 42V22C10 12 16 6 24 6s14 6 14 16v20l-5-4-4.5 4-4.5-4-4.5 4-4.5-4z" />
              <circle cx="19" cy="22" r="2" fill="currentColor" stroke="none" />
              <circle cx="29" cy="22" r="2" fill="currentColor" stroke="none" />
              <path d="M19 30h10" stroke-dasharray="2 3" />
            </svg>
          </span>
          <div class="gs-brand-text">
            <p class="gs-brand-name">GhostSync</p>
            <h1 class="gs-app-name">FieldLedger</h1>
            <p class="gs-tagline">Collaboration beyond the signal</p>
          </div>
        </div>
        <div class="gs-header-actions" id="gs-header-actions"></div>
      </header>
      <!-- Present before the script runs so the first-visit notice is never absent while the app is not yet offline-ready. AppView adopts and updates this element. -->
      <p class="fl-note" data-testid="first-visit-notice">Opening FieldLedger offline for the very first time will not work. Open it once while online.</p>
      <noscript>
        <p class="fl-noscript">GhostSync FieldLedger needs JavaScript to run. Turn JavaScript on in your browser, then reload this page. No account or network connection is needed after the first load.</p>
      </noscript>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
